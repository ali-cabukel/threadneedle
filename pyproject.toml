[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "threadneedle"
version = "0.1.0"
description = "UK macro policy RAG — BoE, ONS and fiscal documents"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.0",
    "langchain-core>=1.6.0",
    "langchain-text-splitters>=1.1.0",
    "langchain-classic>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-chroma>=0.2.0",
    "chromadb>=0.5.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "langchain-openai>=0.2.0",
    "SQLAlchemy>=2.0.0",
    "docling>=2.0.0",
    "pymupdf4llm>=0.0.17",
    "pymupdf>=1.24.0",
    "httpx>=0.27.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[project.scripts]
threadneedle-index = "threadneedle.indexing.build:main"

[tool.hatch.build.targets.wheel]
packages = ["src/threadneedle"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
