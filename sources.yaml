# Document manifest.
#
# Every entry becomes a `source` (the stable identity used by the record
# manager for incremental re-indexing) plus the metadata that the retriever
# will filter on later. Keep `source` stable across runs — if a URL changes,
# the old chunks get deleted and new ones written.
#
# Live ONS *numbers* are not indexed here. The chatbot fetches them at query
# time from https://api.beta.ons.gov.uk/v1 so figures are not six months stale.

documents:
  # --- Bank of England Monetary Policy Reports (quarterly) -----------------
  - url: https://www.bankofengland.co.uk/-/media/boe/files/monetary-policy-report/2025/november/monetary-policy-report-november-2025.pdf
    publisher: bank_of_england
    doc_type: monetary_policy_report
    title: Monetary Policy Report — November 2025
    publication_date: "2025-11-06"
    edition: "2025-11"

  - url: https://www.bankofengland.co.uk/-/media/boe/files/monetary-policy-report/2025/august/monetary-policy-report-august-2025.pdf
